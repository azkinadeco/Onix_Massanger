<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F7F7F9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Onix">
  <meta name="description" content="Onix — chat bareng circle kamu.">
  <title>Onix Messenger</title>
  <link rel="icon" href="icons/favicon.png" type="image/png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // set tema lebih awal supaya nggak "kedip"
    try {
      var t = JSON.parse(localStorage.getItem('onix:theme') || 'null');
      var dark = t ? t.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      if (t) document.documentElement.dataset.accent = t.accent;
      if (t && t.skin) document.documentElement.dataset.skin = t.skin;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <div id="splash" style="position:absolute;inset:0;display:grid;place-items:center;background:var(--bg)">
      <img src="icons/icon-192.png" alt="Onix Messenger" width="84" height="84" style="border-radius:24px;box-shadow:0 12px 36px rgba(0,0,0,0.4)">
    </div>
  </div>
  <noscript>Onix butuh JavaScript buat jalan.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
